# Let's Encrypt-Aussteller für den ganzen Cluster (einmalig anwenden,
# nachdem cert-manager installiert ist). E-Mail für Ablauf-Warnungen anpassen.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: m.schadler@schadler.info
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
