apiVersion: apps/v1
kind: Deployment
metadata:
  name: regex-trainer
  namespace: regex-trainer
  labels: { app: regex-trainer }
spec:
  replicas: 1                      # SQLite -> genau 1 Pod
  revisionHistoryLimit: 3
  strategy:
    type: Recreate                 # PVC ist ReadWriteOnce
  selector:
    matchLabels: { app: regex-trainer }
  template:
    metadata:
      labels: { app: regex-trainer }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          # Digest gepinnt. Neues Image ausrollen:
          #   docker buildx imagetools inspect ghcr.io/schadler/regex-trainer:latest | grep Digest
          #   -> Digest hier eintragen, committen, am NUC: git pull && kubectl apply -k k8s/
          image: ghcr.io/schadler/regex-trainer:latest@sha256:6a93c6d6e3d4849744692fa63af3dc8a773885e8409a719941a6d04d13e90e9f
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports:
            - { name: http, containerPort: 8000 }
          env:
            - { name: TZ,               value: Europe/Vienna }
            - { name: TEST_TASKS_FILE,  value: /config/test_tasks.yaml }
            - { name: GRADE_THRESHOLDS, value: "89,76,63,50" }   # Notenschlüssel 1-4, darunter 5
            - { name: ADMIN_IDLE_MINUTES, value: "30" }          # Lehrerbereich: Auto-Logout nach 30 min Inaktivität
          envFrom:
            - secretRef: { name: regex-trainer }
          volumeMounts:
            - { name: data,  mountPath: /data }
            - { name: tasks, mountPath: /config, readOnly: true }
            - { name: tmp,   mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits:   { memory: 384Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: regex-trainer-data }
        - name: tasks
          configMap: { name: regex-test-tasks, optional: true }
        - name: tmp
          emptyDir: { sizeLimit: 128Mi }
