apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: regex-trainer
  namespace: regex-trainer
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: regex-trainer-redirect-https@kubernetescrd,regex-trainer-ratelimit-general@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [regex.schadler.cloud]
      secretName: regex-trainer-tls
  rules:
    - host: regex.schadler.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: regex-trainer
                port: { name: http }
