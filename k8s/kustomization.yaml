apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: regex-trainer
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
# Image zentral setzen:  kubectl kustomize / kubectl apply -k k8s
images:
  - name: ghcr.io/OWNER/regex-trainer
    newName: ghcr.io/OWNER/regex-trainer
    newTag: latest
